name: Build LeviMania Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.cpp"
      - "**/*.hpp"
      - "CMakeLists.txt"
      - "manifest.json"
      - ".github/workflows/build.yml"
      - "tests/**"
      - "mobtalk-native/**"

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile native safety tests
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            tests/systems_test.cpp src/features/systems.cpp -o systems_test
          ./systems_test
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            tests/port_engines_test.cpp src/features/port_engines.cpp -o port_engines_test
      - name: Run native port engine tests
        run: ./port_engines_test
      - name: Compile and run MobTalk native tests
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Imobtalk-native/include \
            mobtalk-native/tests/mobtalk_test.cpp mobtalk-native/src/mobtalk.cpp -o mobtalk_test
          ./mobtalk_test
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Imobtalk-native/include mobtalk-native/tests/entity_snapshot_test.cpp mobtalk-native/src/entity_snapshot.cpp -pthread -o mobtalk_entity_snapshot_test
          ./mobtalk_entity_snapshot_test
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Imobtalk-native/include \
            mobtalk-native/tests/persistence_test.cpp mobtalk-native/src/persistence.cpp mobtalk-native/src/mobtalk.cpp -o mobtalk_persistence_test
          ./mobtalk_persistence_test
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Imobtalk-native/include \
            mobtalk-native/tests/runtime_bridge_test.cpp mobtalk-native/src/runtime_bridge.cpp -ldl -pthread -o mobtalk_runtime_bridge_test
          ./mobtalk_runtime_bridge_test

  android-arm64:
    runs-on: ubuntu-latest
    needs: safety-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android CMake and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "cmake;3.22.1" "ndk;28.2.13676358"
          sdkmanager --list_installed
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/28.2.13676358/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-28
          -DCMAKE_BUILD_TYPE=Release
          -G Ninja
      - name: Build
        run: cmake --build build --parallel
      - name: Package .levipack
        run: |
          set -euo pipefail
          mkdir -p dist/LeviManiaMobile
          cp manifest.json dist/LeviManiaMobile/
          cp build/liblevimania_mobile.so dist/LeviManiaMobile/
          mkdir -p dist/MobTalkNative
          cp mobtalk-native/manifest.json dist/MobTalkNative/
          cp build/libmobtalk_native.so dist/MobTalkNative/
          (
            cd dist/LeviManiaMobile
            zip -q ../levimania-mobile-arm64.levipack manifest.json liblevimania_mobile.so
          )
          (
            cd dist/MobTalkNative
            zip -q ../mobtalk-native-arm64.levipack manifest.json libmobtalk_native.so
          )
          # Verify both packages have their manifest and native library at ZIP root.
          unzip -Z1 dist/levimania-mobile-arm64.levipack | sort > /tmp/levimania-files.txt
          unzip -Z1 dist/mobtalk-native-arm64.levipack | sort > /tmp/mobtalk-files.txt
          grep -qx 'manifest.json' /tmp/levimania-files.txt
          grep -qx 'liblevimania_mobile.so' /tmp/levimania-files.txt
          grep -qx 'manifest.json' /tmp/mobtalk-files.txt
          grep -qx 'libmobtalk_native.so' /tmp/mobtalk-files.txt
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: native-levipacks-arm64
          path: |
            dist/levimania-mobile-arm64.levipack
            dist/mobtalk-native-arm64.levipack
