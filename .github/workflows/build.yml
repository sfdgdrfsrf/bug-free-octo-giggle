name: Build LeviMania Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.cpp"
      - "**/*.hpp"
      - "CMakeLists.txt"
      - "manifest.json"
      - ".github/workflows/build.yml"

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-android installs command-line tools and accepts SDK licenses.
      # Install packages in a separate retryable step for clearer diagnostics.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also requests the retired `tools` package.
          # Request platform-tools only; install CMake and NDK below.
          packages: 'platform-tools'

      - name: Install Android CMake and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "cmake;3.22.1" "ndk;28.2.13676358"
          sdkmanager --list_installed

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/28.2.13676358/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-28
          -DCMAKE_BUILD_TYPE=Release
          -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Package .levipack
        run: |
          set -euo pipefail
          mkdir -p dist/LeviManiaMobile
          cp manifest.json dist/LeviManiaMobile/
          cp build/liblevimania_mobile.so dist/LeviManiaMobile/
          cd dist
          zip -r levimania-mobile-arm64.levipack LeviManiaMobile

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: levimania-mobile-arm64-levipack
          path: dist/levimania-mobile-arm64.levipack
